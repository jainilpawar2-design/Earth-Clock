<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Real-Time Earth Clock</title>

        <style>
            * {margin: 0; padding: 0; box-sizing: border-box; }

            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #04050a;
                font-family: Arial, Arial, Helvetica, sans-serif;
            }

            #scene-container {
                position: fixed;
                top: 0; left: 0;
                width: 100%;
                height: 100%;
            }

            canvas { display: block; }

            .ui-layer {
                position: fixed;
                top: 0; left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
            }

            .title-block {
                position: absolute;
                top: 26px;
                left: 30px;
                color: #ffffff;
            }

            .title-block h1 {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 0.5px;
                text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            }

            .title-block p {
                margin-top: 6px;
                font-size: 12.5px;
                color: #9aa3b8;
                max-width: 300px;
                line-height: 1.5;
            }

            .hint {
                position: absolute;
                bottom: 22px;
                left: 30px;
                color: #7c8399;
                font-size: 12px;
                letter-spacing: 0.4px;
            }

            .clock-panel {
                position: absolute;
                top: 26px;
                right:30px;
                pointer-events: auto;
                background: rgba(14, 17, 26, 0.6);
                border: 1px solid rgba(255,255,255,0.09);
                backdrop-filter: blur(10px);
                border-radius: 14px;
                padding: 20px 24px;
                color: #ffffff;
                min-width: 220px;
                text-align: center;
            }

            .clock-panel .time {
                font-size: 34px;
                font-weight: 700;
                letter-spacing: 1px;
                font-variant-numeric: tabular-nums;
                }

                .clock-panel .date {
                    margin-top: 4px;
                    font-size: 12.5px;
                    color: #9aa3b8;
                }

                .clock-panel .tz {
                    margin-top: 2px;
                    font-size: 11px;
                    color: #6c7488;
                }

                .badge {
                    margin-top: 14px;
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    padding: 6px 14px;
                    border-radius: 20px;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 0.5px;
                }

                .badge.day {
                    background: rgba(255, 214, 92, 0.15);
                    color: #ffd65c;
                    border: 1px solid rgba(255, 214, 92, 0.4);
                }

                .badge.night {
                    background: rgba(108, 141, 255, 0.15);
                    color: #6c8dff;
                    border: 1px solid rgba(108, 141, 255, 0.4);
                }

                .legend {
                    position: absolute;
                    bottom: 22px;
                    right: 30px;
                    pointer-events: none;
                    background: rgba(14, 17, 26, 0.5);
                    border: 1px solid rgba(255,255,255,0.88);
                    border-radius: 10px;
                    padding: 10px 14px;
                    color: #9aa3b8;
                    font-size: 11px;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                }

                .legend .dot {
                    width: 9px;
                    height: 9px;
                    border-radius: 50%;
                    background: #ff5e5e;
                    flex-shrink: 0;
                }
